<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atualização - PUT</title>

    <link rel="stylesheet" href="../style.css">
</head>

<body>

    <h1>CRUD - Cadastro de Pessoas</h1>

    <nav>
        <a href="../index.html">Início</a>
        <a href="../post/post.html">Cadastrar</a>
        <a href="../get/get.html">Listar</a>
        <a href="../put/put.html">Atualizar</a>
        <a href="../delete/delete.html">Excluir</a>
    </nav>

    <hr>

    <h2>PUT - Atualizar Pessoa</h2>

    <h3>Buscar por CPF</h3>

    <label for="cpfBusca">CPF:</label>
    <input type="text" id="cpfBusca">

    <button type="button" id="btnBuscar">Buscar</button>

    <p id="mensagemBusca"></p>

    <hr>

    <form id="formAtualizar" style="display: none;">

        <input type="hidden" id="id">

        <label for="cpf">CPF:</label>
        <input type="text" id="cpf" required>

        <br><br>

        <label for="nome">Nome:</label>
        <input type="text" id="nome" required>

        <br><br>

        <label for="sobrenome">Sobrenome:</label>
        <input type="text" id="sobrenome" required>

        <br><br>

        <label for="email">E-mail:</label>
        <input type="email" id="email" required>

        <br><br>

        <label for="idade">Idade:</label>
        <input type="number" id="idade" required>

        <br><br>

        <label for="telefone">Telefone:</label>
        <input type="text" id="telefone" required>

        <br><br>

        <label for="rua">Rua:</label>
        <input type="text" id="rua" required>

        <br><br>

        <label for="bairro">Bairro:</label>
        <input type="text" id="bairro" required>

        <br><br>

        <label for="cidade">Cidade:</label>
        <input type="text" id="cidade" required>

        <br><br>

        <label for="estado">Estado:</label>
        <input type="text" id="estado" required>

        <br><br>

        <label for="rg">RG:</label>
        <input type="text" id="rg" required>

        <br><br>

        <button type="submit">Atualizar</button>

    </form>

    <p id="mensagemAtualizacao"></p>

    <script src="put.js"></script>

</body>

</html>
